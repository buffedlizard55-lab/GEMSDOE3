[project]
name = "gems3-riftline"
version = "0.1.0"
description = "Auditable fault discovery experiments and strict GEMS GeoTIFF submissions"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 108
exclude = ["legacy", ".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
