name: Riftline checks
on:
  push:
    branches: [main, 'arena/01a0d8fd-gemsdoe3']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      PYTHON: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: pip install -r requirements-dev.txt
      - run: npm ci --no-audit --no-fund
      - name: Lint and unit / artifact regressions
        run: |
          set -euo pipefail
          ruff check gems3 scripts tests
          python -m pytest -q --junitxml=evidence/ci-tests.xml
          python scripts/check_published.py
      - name: Render and stage evidence-backed pages
        run: |
          set -euo pipefail
          python -m gems3.site
          python scripts/stage_site.py
      - name: Real Chromium interaction and generated-TIFF validation
        run: node scripts/run_browser_tests.cjs
      - name: Preserve actual checks and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: riftline-checks-${{ github.run_id }}
          path: |
            evidence/ci-tests.xml
            evidence/browser-tests.json
            test-results/
          retention-days: 14
